<svg viewBox="0 0 1080 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="680" fill="#ffffff"/>
  <text x="540" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1f2e">Entity Relationship Diagram</text>
  <text x="540" y="56" text-anchor="middle" font-size="13" fill="#5e6680">Target schema for the EF Core / SQL Server port</text>

  <defs>
    <marker id="one" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4256"/>
    </marker>
  </defs>

  <!-- ===== User entity ===== -->
  <g>
    <rect x="60" y="100" width="230" height="188" rx="6" fill="#eef1f8" stroke="#3a4256" stroke-width="1.5"/>
    <rect x="60" y="100" width="230" height="30" rx="6" fill="#3a4256"/>
    <text x="175" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">User</text>
    <text x="72" y="150" font-size="12" fill="#1a1f2e">PK  Username : string</text>
    <text x="72" y="170" font-size="12" fill="#1a1f2e">    PasswordHash : string</text>
    <text x="72" y="190" font-size="12" fill="#1a1f2e">    Role : enum(Admin,Agent,Member)</text>
    <text x="72" y="210" font-size="12" fill="#1a1f2e">    CreatedAt : datetime</text>
    <text x="72" y="230" font-size="12" fill="#1a1f2e">    IsActive : bool</text>
  </g>

  <!-- ===== Ticket entity ===== -->
  <g>
    <rect x="420" y="90" width="260" height="290" rx="6" fill="#e9eefb" stroke="#3a4256" stroke-width="1.5"/>
    <rect x="420" y="90" width="260" height="30" rx="6" fill="#3a4256"/>
    <text x="550" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Ticket</text>
    <text x="432" y="140" font-size="12" fill="#1a1f2e">PK  Id : string</text>
    <text x="432" y="160" font-size="12" fill="#1a1f2e">    Title : string</text>
    <text x="432" y="180" font-size="12" fill="#1a1f2e">    Description : string</text>
    <text x="432" y="200" font-size="12" fill="#1a1f2e">    Department : string</text>
    <text x="432" y="220" font-size="12" fill="#1a1f2e">    Priority : enum</text>
    <text x="432" y="240" font-size="12" fill="#1a1f2e">    Topic : string</text>
    <text x="432" y="260" font-size="12" fill="#1a1f2e">    Status : enum</text>
    <text x="432" y="280" font-size="12" fill="#1a1f2e">    TriageNote : string?</text>
    <text x="432" y="300" font-size="12" fill="#1a1f2e">FK  CreatedByUsername : string</text>
    <text x="432" y="320" font-size="12" fill="#1a1f2e">FK  AssignedToUsername : string?</text>
    <text x="432" y="340" font-size="12" fill="#1a1f2e">    CreatedAt : datetime</text>
    <text x="432" y="360" font-size="12" fill="#1a1f2e">    UpdatedAt : datetime</text>
  </g>

  <!-- ===== Comment entity ===== -->
  <g>
    <rect x="790" y="90" width="230" height="150" rx="6" fill="#e5f3ec" stroke="#3a4256" stroke-width="1.5"/>
    <rect x="790" y="90" width="230" height="30" rx="6" fill="#3a4256"/>
    <text x="905" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Comment</text>
    <text x="802" y="140" font-size="12" fill="#1a1f2e">PK  Id : int</text>
    <text x="802" y="160" font-size="12" fill="#1a1f2e">FK  TicketId : string</text>
    <text x="802" y="180" font-size="12" fill="#1a1f2e">FK  AuthorUsername : string</text>
    <text x="802" y="200" font-size="12" fill="#1a1f2e">    Text : string</text>
    <text x="802" y="220" font-size="12" fill="#1a1f2e">    CreatedAt : datetime</text>
  </g>

  <!-- ===== TicketHistory entity ===== -->
  <g>
    <rect x="790" y="270" width="230" height="170" rx="6" fill="#fbe9ec" stroke="#3a4256" stroke-width="1.5"/>
    <rect x="790" y="270" width="230" height="30" rx="6" fill="#3a4256"/>
    <text x="905" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">TicketHistory</text>
    <text x="802" y="320" font-size="12" fill="#1a1f2e">PK  Id : int</text>
    <text x="802" y="340" font-size="12" fill="#1a1f2e">FK  TicketId : string</text>
    <text x="802" y="360" font-size="12" fill="#1a1f2e">FK  ActorUsername : string</text>
    <text x="802" y="380" font-size="12" fill="#1a1f2e">    Action : string</text>
    <text x="802" y="400" font-size="12" fill="#1a1f2e">    Detail : string</text>
    <text x="802" y="420" font-size="12" fill="#1a1f2e">    At : datetime</text>
  </g>

  <!-- ===== Relationships ===== -->
  <!-- User -> Ticket (created) -->
  <line x1="290" y1="180" x2="416" y2="200" stroke="#3a4256" stroke-width="1.5" marker-end="url(#one)"/>
  <text x="330" y="170" font-size="11" fill="#3a4256">1 creates *</text>

  <!-- User -> Ticket (assigned, optional, curved below) -->
  <path d="M 175 288 C 175 460, 420 460, 420 320" fill="none" stroke="#3a4256" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#one)"/>
  <text x="270" y="470" font-size="11" fill="#3a4256">1 is assigned to (agent) 0..* </text>

  <!-- Ticket -> Comment -->
  <line x1="680" y1="160" x2="786" y2="160" stroke="#3a4256" stroke-width="1.5" marker-end="url(#one)"/>
  <text x="720" y="150" font-size="11" fill="#3a4256">1 has *</text>

  <!-- Ticket -> TicketHistory -->
  <line x1="680" y1="330" x2="786" y2="330" stroke="#3a4256" stroke-width="1.5" marker-end="url(#one)"/>
  <text x="710" y="320" font-size="11" fill="#3a4256">1 logs *</text>

  <!-- User -> Comment (author) -->
  <path d="M 290 220 C 550 240, 700 90, 800 100" fill="none" stroke="#8d96ad" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#one)"/>
  <text x="560" y="220" font-size="11" fill="#5e6680">1 authors *</text>

  <!-- User -> TicketHistory (actor) -->
  <path d="M 290 250 C 550 380, 700 400, 796 390" fill="none" stroke="#8d96ad" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#one)"/>
  <text x="560" y="400" font-size="11" fill="#5e6680">1 performs *</text>

  <!-- ===== Legend ===== -->
  <rect x="60" y="560" width="960" height="90" rx="10" fill="#fafbfc" stroke="#d8dce6" stroke-width="1"/>
  <text x="80" y="585" font-size="13" font-weight="700" fill="#1a1f2e">Notes</text>
  <text x="80" y="606" font-size="12" fill="#3a4256">• Ticket.AssignedToUsername is nullable — a ticket has no agent until claimed. Ticket.Status and Priority are stored as enums in EF Core.</text>
  <text x="80" y="624" font-size="12" fill="#3a4256">• Comment and TicketHistory both belong to exactly one Ticket and reference the acting User — matching the prototype's "comments[]"/"history[]" arrays.</text>
</svg>
