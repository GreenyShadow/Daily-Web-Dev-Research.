<svg viewBox="0 0 1250 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="1250" height="680" fill="#ffffff"/>
<text x="625" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1f2e">Use Case Diagram — Agent</text>
<text x="625" y="56" text-anchor="middle" font-size="12.5" fill="#5e6680">Internal Support Request Management System</text>

<!-- System boundary -->
<rect x="250" y="90" width="880" height="440" rx="10" fill="#fafbfc" stroke="#000000" stroke-width="1.5"/>
<text x="690" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f2e">Internal Support Request Management System</text>

<!-- Association lines -->
<g stroke="#000000" stroke-width="1.3" fill="none">
<line x1="140" y1="320" x2="315" y2="170"/>
<line x1="140" y1="320" x2="575" y2="170"/>
<line x1="140" y1="320" x2="315" y2="270"/>
<line x1="140" y1="320" x2="575" y2="270"/>
<line x1="140" y1="320" x2="835" y2="270"/>
<line x1="140" y1="320" x2="315" y2="370"/>
<line x1="140" y1="320" x2="575" y2="370"/>
<line x1="140" y1="320" x2="835" y2="370"/>
<line x1="140" y1="320" x2="315" y2="470"/>
</g>

<!-- Use cases -->
<g text-anchor="middle">
<ellipse cx="420" cy="170" rx="105" ry="28" fill="#eef1f8" stroke="#000000" stroke-width="1.4"/>
<text x="420" y="175" font-size="13" font-weight="600" fill="#1a1f2e">Login</text>
<text x="420" y="206" font-size="9.5" font-style="italic" fill="#8a92a8">(shared with Member, Admin)</text>

<ellipse cx="680" cy="170" rx="105" ry="28" fill="#eef1f8" stroke="#000000" stroke-width="1.4"/>
<text x="680" y="175" font-size="13" font-weight="600" fill="#1a1f2e">Logout</text>
<text x="680" y="206" font-size="9.5" font-style="italic" fill="#8a92a8">(shared with Member, Admin)</text>

<ellipse cx="420" cy="270" rx="105" ry="28" fill="#eef7f0" stroke="#000000" stroke-width="1.4"/>
<text x="420" y="275" font-size="12.5" font-weight="600" fill="#1a1f2e">View Support Queue</text>

<ellipse cx="680" cy="270" rx="105" ry="28" fill="#eef7f0" stroke="#000000" stroke-width="1.4"/>
<text x="680" y="275" font-size="13" font-weight="600" fill="#1a1f2e">Claim Ticket</text>

<ellipse cx="940" cy="270" rx="105" ry="28" fill="#eef7f0" stroke="#000000" stroke-width="1.4"/>
<text x="940" y="275" font-size="13" font-weight="600" fill="#1a1f2e">Release Ticket</text>

<ellipse cx="420" cy="370" rx="105" ry="32" fill="#eef7f0" stroke="#000000" stroke-width="1.4"/>
<text x="420" y="367" font-size="12.5" font-weight="600" fill="#1a1f2e">Update Ticket Status</text>
<text x="420" y="383" font-size="9.5" fill="#5e6680">(resolve / close)</text>

<ellipse cx="680" cy="370" rx="105" ry="34" fill="#eef7f0" stroke="#000000" stroke-width="1.4"/>
<text x="680" y="366" font-size="12.5" font-weight="600" fill="#1a1f2e">Search &amp; Filter</text>
<text x="680" y="383" font-size="12.5" font-weight="600" fill="#1a1f2e">Tickets</text>

<ellipse cx="940" cy="370" rx="105" ry="28" fill="#fbf3e6" stroke="#000000" stroke-width="1.4"/>
<text x="940" y="375" font-size="12.5" font-weight="600" fill="#1a1f2e">Reassign Ticket</text>
<text x="940" y="406" font-size="9.5" font-style="italic" fill="#8a92a8">(shared with Admin)</text>

<ellipse cx="420" cy="470" rx="105" ry="28" fill="#fbf3e6" stroke="#000000" stroke-width="1.4"/>
<text x="420" y="475" font-size="12.5" font-weight="600" fill="#1a1f2e">Add Internal Comment</text>
<text x="420" y="506" font-size="9.5" font-style="italic" fill="#8a92a8">(shared with Admin)</text>
</g>

<!-- Actor -->
<g stroke="#000000" stroke-width="2" fill="none">
<circle cx="110" cy="280" r="15" fill="#ffffff"/>
<line x1="110" y1="295" x2="110" y2="325"/>
<line x1="91" y1="308" x2="129" y2="308"/>
<line x1="110" y1="325" x2="95" y2="355"/>
<line x1="110" y1="325" x2="125" y2="355"/>
</g>
<text x="110" y="379" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3f9d63">Agent</text>

<!-- Legend -->
<rect x="60" y="560" width="1130" height="90" rx="10" fill="#fafbfc" stroke="#d8dce6" stroke-width="1"/>
<text x="80" y="583" font-size="12" font-weight="700" fill="#1a1f2e">Legend</text>
<ellipse cx="115" cy="600" rx="14" ry="9" fill="#eef1f8" stroke="#000000" stroke-width="1.2"/>
<text x="138" y="604" font-size="11.5" fill="#3a4256">Shared across all roles</text>
<ellipse cx="330" cy="600" rx="14" ry="9" fill="#eef7f0" stroke="#000000" stroke-width="1.2"/>
<text x="353" y="604" font-size="11.5" fill="#3a4256">Agent-only</text>
<ellipse cx="500" cy="600" rx="14" ry="9" fill="#fbf3e6" stroke="#000000" stroke-width="1.2"/>
<text x="523" y="604" font-size="11.5" fill="#3a4256">Shared with Admin</text>
<text x="80" y="626" font-size="11" fill="#3a4256">All lines use a single black stroke. See use-case-diagram-member.svg and use-case-diagram-admin.svg for the Member and Admin views.</text>
</svg>
